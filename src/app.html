<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon/favicon.svg" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"
      href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Fathom - beautiful, simple website analytics -->
    <script src="https://cdn.usefathom.com/script.js" data-site="DDUWRXWI" defer></script>

    <!-- / Fathom -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@alpha" />
    %sveltekit.head%
    <!-- Fallback metadata for routes that render client-side; pages that set
         their own <title>/description via svelte:head override these. -->
    <title>FireInSite — UK Wildfire Behaviour & Fire Danger Prediction</title>
    <meta
      name="description"
      content="FireInSite predicts wildfire behaviour across UK heath, shrub and grassland fuels — fire spread rate, flame length and intensity from live weather forecasts, free in your browser."
    />
  </head>

  <body data-sveltekit-preload-data>
    <div id="svelte" class="relative flex min-h-screen w-full flex-col">%sveltekit.body%</div>
    <aside class="fixed z-50 hidden right-5 bottom-5 md:block">
    </aside>
  </body>
</html>
